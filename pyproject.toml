[project]
name = "aic-video-retrieval"
version = "0.1.0"
description = "Interactive video retrieval đa phương thức cho AI Challenge TP.HCM"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymilvus==2.6.12",
    "pymongo==4.17.0",
    "elasticsearch[async]==9.3.0",
    # POST /api/search/image (plan §P1.1) accepts multipart/form-data --
    # FastAPI's File()/Form() raise at import time without this installed.
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "black==26.5.1",
    "isort==8.0.1",
    "ruff==0.16.0",
]
data = [
    "kagglehub==1.0.2",
]
beit3 = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "timm==0.4.12",
    "torchscale==0.2.0",
    "transformers==4.44.2",
    "sentencepiece==0.2.2",
]
ingest = [
    "aic-video-retrieval[beit3]",
    "opencv-python-headless==4.10.0.84",
    "imagehash==4.3.1",
    "pillow==11.0.0",
    "pyyaml==6.0.3",
]
ocr = [
    "aic-video-retrieval[ingest]",
    "google-genai==2.16.0",
]
eval = [
    # eval/build_eval_set.py needs exactly what [ocr] already bundles --
    # google-genai (caption generation) + pillow (keyframe image loading).
    # Reuses the extra instead of duplicating its pins (P0.4', .claude/plans/
    # p0-4-build-eval-set.plan.md).
    "aic-video-retrieval[ocr]",
]
asr = [
    "aic-video-retrieval[ingest]",
    "faster-whisper==1.2.1",
    "ctranslate2==4.6.2",
]
asr-embed = [
    "aic-video-retrieval[ingest]",
    "sentence-transformers==5.6.1",
]
baseline-clip = [
    # P1.4 mandatory baseline (PRD §6.3): CLIP ViT-B/32 run on OUR keyframes
    # with OUR encoder, never BTC's clip-features-32/ (references.md §2.5 --
    # those are keyed to BTC's own keyframes, not comparable at segment level).
    #
    # open-clip-torch itself is DELIBERATELY NOT listed as a normal dep here.
    # open-clip-torch==3.3.0 hard-requires timm>=1.0.17 in its own metadata,
    # which conflicts with beit3's timm==0.4.12 pin above (BEiT-3's vendored
    # code needs the old timm API) -- pip cannot satisfy both in one
    # resolution (surfaces as "resolution-too-deep", not a clean conflict
    # message, because of torch's own large sympy/mpmath dependency tree).
    # In practice this constraint is stricter than reality: open_clip wraps
    # `import timm` in try/except ImportError and only touches it for
    # timm-backed vision towers -- ViT-B/32 (OpenCLIP's own architecture)
    # never imports timm at runtime. So install it separately with --no-deps,
    # after this extra provides its OTHER real runtime deps below:
    #   pip install -e ".[baseline-clip]"
    #   pip install --no-deps open-clip-torch==3.3.0
    "aic-video-retrieval[ingest]",
    "regex",
    "ftfy",
    "tqdm",
    "huggingface-hub",
    "safetensors",
]
encoder-candidates = [
    # encoder-swap plan (.claude/plans/encoder-swap-siglip2-pecore.plan.md
    # §T2): SigLip2Encoder needs transformers>=4.49 (SigLIP 2 landed there;
    # the checkpoint's config.json records transformers_version:
    # "4.49.0.dev0"), which directly conflicts with beit3's
    # transformers==4.44.2 pin above. Deliberately does NOT depend on
    # "aic-video-retrieval[ingest]" the way ocr/eval/asr do -- ingest pulls
    # in [beit3], which would re-introduce the exact conflict this extra
    # exists to avoid. Install in a SEPARATE venv from the main one (plan
    # §T0 -- BEiT-3 and this candidate cannot coexist in one
    # process/interpreter until that spike resolves it):
    #   python -m venv .venv-candidate
    #   .venv-candidate/Scripts/pip install -e ".[encoder-candidates]"
    #
    # Upper bound verified 2026-08-13 the hard way: an unbounded
    # "transformers>=4.49" resolved to transformers==5.15.0, which prints
    # "[transformers] Disabling PyTorch because PyTorch >= 2.5 is required
    # but found 2.4.1" and silently falls back to a tokenizer-only mode --
    # AutoModel.from_pretrained then raises ImportError as if torch were
    # never installed, even though `import torch` alone works fine. Pinning
    # torch==2.4.1 (matching beit3's pin, kept in sync on purpose) means
    # transformers must stay below the version that raised its own torch
    # floor to 2.5. <5.0 keeps this extra inside the 4.x line the
    # checkpoint's own config.json was verified against, instead of the
    # untested 5.x API surface.
    "torch==2.4.1",
    "transformers>=4.49,<5.0",
    "pillow==11.0.0",
]
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "pipelines*", "datasets*", "eval*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends(...) default-argument pattern is the framework's own
# documented idiom (fastapi.md), not the mutable-default-arg bug B008 warns
# about -- Depends() calls are stateless factories re-evaluated per request.
"app/api/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration and not model'"
markers = [
    "integration: requires the docker-compose stack (Milvus/Elasticsearch/MongoDB) running",
    "model: requires torch/timm/torchscale (pip install -e '.[beit3]') and a downloaded checkpoint",
]

[tool.coverage.run]
source = ["app", "pipelines", "datasets", "eval", "scripts"]
