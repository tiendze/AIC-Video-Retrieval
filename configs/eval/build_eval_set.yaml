# eval/build_eval_set.py BuildEvalSetConfig -- self-generated eval-set labeling
# protocol (PRD §6.1.2, .claude/plans/p0-4-build-eval-set.plan.md).
# Field names match BuildEvalSetConfig exactly; a caller loads this file and
# constructs BuildEvalSetConfig(**yaml.safe_load(...)) before calling generate().

# Determinism (PRD §6.1.2 step 1: "seed cố định"). No magic numbers -- lives
# here, not hard-coded, so a re-run with the same seed reproduces the same
# sample (test_eval_set_sampling_is_deterministic_given_seed).
seed: 20260809

# "all" = full 873-video corpus (chủ dự án 2026-08-09: ingest đã xong toàn
# kho, không còn giới hạn ở pilot L21-L24 như lúc viết PRD §6.1.2 gốc).
split: all

# Quy mô v1 theo PRD §6.1.2 bước 1 -- ~600 shot rời cho Textual KIS.
kis_sample_size: 600

# TRAKE (PRD §6.1.2's task table, N ∈ {3,5,7}) cần chuỗi shot LIÊN TIẾP,
# điều mà mẫu KIS rải ngẫu nhiên trên 873 video hầu như không bao giờ sinh
# ra. Bộ eval là artifact đóng băng (đổi ⇒ tăng eval_set_version ⇒ chạy lại
# toàn bộ baseline), nên quota TRAKE được sinh cùng đợt, không để dành "làm
# sau" -- chi phí thêm chỉ ~200 ảnh (chủ dự án 2026-08-09).
trake_sequence_count: 40
trake_sequence_length: 5

# Dưới p10 của phân bố độ dài shot đo trên pilot (1,30s, verify 2026-08-09).
# Shot < 1s gần như chắc chắn là flash-cut giữa hai cảnh, không có nội dung
# ổn định để làm đích truy hồi -- loại trước khi lấy mẫu, không loại sau khi
# đã tốn tiền gọi Gemini.
min_shot_duration_sec: 1.0

# Bám configs/ingest/ocr.yaml:max_ocr_side -- 384px cắt còn 258 token/ảnh
# thay vì 516 token ở kích thước gốc 1280x720 (references.md §5.1).
max_image_side: 384

# Lọc chung chung tầng 1 (PRD §6.1.2 bước 3): caption dưới ngưỡng số từ nội
# dung (sau khi bỏ stopword) gần như chắc chắn là câu rỗng nghĩa kiểu "Một
# người đang nói chuyện".
min_content_words: 4

# Lọc chung chung tầng 2: hai caption có tỉ lệ Jaccard trên tập từ nội dung
# vượt ngưỡng này bị coi là "cùng một câu" khi so khớp gần đúng.
near_duplicate_jaccard: 0.6

# PRD §6.1.3: "caption khớp > X shot khác nhau" -- vì chưa có search engine
# thật ở P0 (P0.8 chưa xây), đây là proxy tính được ngay: một caption bị gắn
# "generic_duplicate" nếu nó gần-trùng (theo near_duplicate_jaccard) với hơn
# max_near_duplicates caption khác trong cùng lô sinh.
max_near_duplicates: 3

# Stopword tiếng Việt dùng để tính content_words() -- là dữ liệu cấu hình
# (CLAUDE.md §6 "không magic number"), không hard-code trong code.
vietnamese_stopwords:
  - "một"
  - "các"
  - "là"
  - "và"
  - "có"
  - "của"
  - "trong"
  - "được"
  - "này"
  - "đang"
  - "với"
  - "cho"
  - "tại"
  - "về"
  - "người"
  - "đó"
  - "khi"
  - "đã"
  - "sẽ"
  - "những"
  - "trên"
  - "bị"
  - "để"
  - "ra"
  - "vào"
  - "lên"
  - "theo"
  - "hay"
  - "hoặc"
  - "rất"

# GeminiCaptionGenerator retry policy -- giống hệt configs/ingest/ocr.yaml
# (exponential backoff, retry_base_delay_seconds * 2^attempt).
max_retries: 3
retry_base_delay_seconds: 1.0

# Model SINH NHÃN, khác model bị đánh giá (BEiT-3/SigLIP) -- CLAUDE.md §3
# bất biến "model sinh nhãn ≠ model bị đánh giá".
#
# ⚠️ ĐÃ THỬ gemini-2.5-flash (2026-08-09, để tiết kiệm 5x chi phí) và ĐẢO
# LẠI trong cùng ngày: test trực tiếp trên ảnh thật cho thấy 2.5-flash
# HOÀN TOÀN LỜ `response_format` qua Interactions API -- trả về văn bản
# thường thay vì JSON đúng schema, dù request đã verify đún g shape (không
# phải lỗi code). gemini-3.6-flash trả đúng JSON `{"caption": "..."}` với
# NGUYÊN VĂN cùng request. Kết luận: response_format là tính năng model
# 3.x mới hỗ trợ đầy đủ qua Interactions API, không phải lỗi cấu hình.
# Bám đúng model dùng ở configs/ingest/ocr.yaml.
gemini_model: gemini-3.6-flash
