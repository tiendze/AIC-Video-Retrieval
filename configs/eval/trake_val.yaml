# eval/run.py EvalRunConfig -- P2.3 TRAKE evaluation run (plan §P2.3,
# PRD §6.4). Same EvalRunConfig shape as aic_pilot.yaml (CLAUDE.md §6:
# eval/run.py is the ONE entry point -- this is a config variant, not a
# second script), with score_trake: true added and the KIS-focused optional
# channels (VI->EN sidecar, live-translated, CLIP baseline) turned off so a
# TRAKE-focused run doesn't pay for GPU-heavy channels it doesn't need.
split: all

dataset_root: data
eval_set_path: configs/eval/aic_eval_v1.json
pilot_available_path: configs/eval/pilot_available_v1.txt

top_ks: [1, 5, 20, 50, 100]

# Kept minimal (TRAKE is the point of this config) -- semantic still runs so
# the report isn't TRAKE-only with nothing to sanity-check search_service
# wiring against.
modes: [semantic]

random_baseline_seed: 20260810
leakage_jaccard_threshold: 0.5
vietnamese_stopwords:
  - "một"
  - "các"
  - "là"
  - "và"
  - "có"
  - "của"
  - "trong"
  - "được"
  - "này"
  - "đang"
  - "với"
  - "cho"
  - "tại"
  - "về"
  - "người"
  - "đó"
  - "khi"
  - "đã"
  - "sẽ"
  - "những"
  - "trên"
  - "bị"
  - "để"
  - "ra"
  - "vào"
  - "lên"
  - "theo"
  - "hay"
  - "hoặc"
  - "rất"

reports_dir: reports

# Off for this config -- these load extra GPU models unrelated to TRAKE
# (aic_pilot.yaml is where the KIS-channel diagnostics live).
query_translation_path: ""
query_translation_modes: [semantic]
translate_semantic_live: false
score_clip_baseline: false

# P2.3 (PRD §6.4): the actual point of this config file. PRD §6.4's
# mandatory breakdown is N ∈ {3, 5, 7}, but N=7 is DROPPED here (chủ dự án
# 2026-08-14, verified against a real run): aic_eval_v1.json's TRAKE
# candidates were sampled with build_eval_set.yaml's trake_sequence_length=5
# (40 sequences × 5 consecutive shots each), so a 7-consecutive-order_index
# run essentially cannot exist in the frozen label set --
# run_trake_eval() correctly raises ValueError rather than printing a
# silent all-zero N=7 row (CLAUDE.md §7). Re-add 7 here only after
# regenerating aic_eval_v1.json with trake_sequence_length>=7 (a NEW
# eval_set_version + full re-review + full baseline re-run, CLAUDE.md §8 --
# not a config-only change) -- tracked for P2.4's ablation table, which
# needs the full N∈{3,5,7} breakdown and will have to solve this first.
#
# trake_top_k=10 mirrors TrakeService's own configs/search/trake.yaml
# default_top_k. trake_lambda_penalty: null uses app/services/
# dante_service.py:LAMBDA_TIME. P2.4's ablation sweep is a SEPARATE config
# surface, not this file -- see plan §P2.4.
score_trake: true
trake_sequence_lengths: [3, 5]
trake_top_k: 10
trake_lambda_penalty: null
