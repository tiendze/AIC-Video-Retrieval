# eval/run.py EvalRunConfig -- P0.9 evaluation run configuration (plan
# §P0.9). Field names match EvalRunConfig exactly (mirrors the
# build_eval_set.yaml -> BuildEvalSetConfig convention).
#
# ⚠️ Filename kept as "aic_pilot.yaml" because plan §P0.9's own verify
# command names this path literally ("python -m eval.run --config
# configs/eval/aic_pilot.yaml"), but split=all below covers the FULL
# 873-video corpus, not just the original L21-L24 pilot -- the eval set
# itself outgrew "pilot" scope on 2026-08-09 (plan §P0.4' history) while
# this file's name did not follow. Flagged here rather than silently
# renamed (CLAUDE.md §2: mismatch phải báo ra).
split: all

dataset_root: data
eval_set_path: configs/eval/aic_eval_v1.json

# Denominator: only ground-truth records whose video_id is in this file are
# scored. A video not yet ingest-"complete" has no keyframes to be found by
# -- leaving it in would silently deflate every Recall for reasons that have
# nothing to do with retrieval quality (CLAUDE.md §8: "số video_id duy nhất
# thực tế đánh giá được" must be reported, and this file IS that count).
pilot_available_path: configs/eval/pilot_available_v1.txt

# AIC 2026's own submission scoring mesh (references.md §1.2). top_k passed
# to SearchService.search() is max(top_ks), so one call per query covers
# every K without re-querying.
top_ks: [1, 5, 20, 50, 100]

# Channels reported independently (plan §P0.8/§P0.9).
#
# "hybrid" (RRF of semantic+ocr, plan §P1.3) was REMOVED from SearchService
# entirely 2026-08-12, not just excluded here -- see app/services/
# search_service.py module docstring. It measured worse than the best
# single channel, and RRF-by-rank was mixing a much weaker channel into a
# much stronger one regardless of the weaker channel's TRUE quality, which
# turned out to be unmeasurable in the first place (next paragraph).
#
# "ocr" is OFF the routine list because THIS LABEL SET STRUCTURALLY CANNOT
# SCORE IT, not because the channel measured poorly. eval/build_eval_set.py's
# Gemini caption prompt explicitly instructs: "KHÔNG chép lại chữ hiển thị
# trên màn hình (phụ đề, banner, số liệu chạy chữ)" -- captions are built to
# contain ZERO on-screen-text signal by design (anti-leakage, CLAUDE.md §8:
# "BM25 cao bất thường => nghi bộ nhãn rò rỉ"). So ocr's measured 0.0254 is
# coincidental word overlap, not a real reading of BM25/OCR retrieval
# quality -- chủ dự án 2026-08-12. Scoring it here would print a number that
# looks like "the OCR channel is bad" when the true statement is "this label
# set cannot see the OCR channel at all" (CLAUDE.md §7: "thiếu dữ liệu phải
# fail rõ ràng, không trả rỗng" -- same principle: a number that means
# nothing must not be reported as if it measures something).
# OCR is being repositioned as a first-class TEXT/BM25 search mode
# (docs/research-encoder-vietnamese.md §8) evaluated separately, once there
# is a label source that isn't structurally blind to on-screen text (e.g.
# queries built from BTC video title/description instead of Gemini
# captions) -- not re-added to this file until that exists.
modes: [semantic]

# RandomBaseline determinism -- same "seed cố định" convention as
# build_eval_set.yaml (PRD §6.1.2 step 1), independent seed/value since it
# seeds a different sampling process (keyframe pool, not shot sampling).
random_baseline_seed: 20260810

# eval/metrics/leakage.py reporting cutoff: a caption<->ocr_text Jaccard
# overlap at or above this is flagged as a likely leak in report.md. This is
# a REPORTING cutoff, not a quality gate like build_eval_set.py's 30%
# rejection-rate gate -- CLAUDE.md §4 "con người chốt đáp án cuối", a human
# reads the flagged rows and decides, this file never refuses to write a
# report over it.
leakage_jaccard_threshold: 0.5

# Vietnamese stopwords for content_words() (eval/build_eval_set.py, reused
# by eval/metrics/leakage.py) -- intentionally the SAME list as
# build_eval_set.yaml so "content word" means the same thing in both eval
# artifacts. Duplicated here rather than one config importing the other:
# the two CLIs (`eval.build_eval_set`, `eval.run`) are loaded independently
# and neither should need to know the other's file layout to run standalone.
vietnamese_stopwords:
  - "một"
  - "các"
  - "là"
  - "và"
  - "có"
  - "của"
  - "trong"
  - "được"
  - "này"
  - "đang"
  - "với"
  - "cho"
  - "tại"
  - "về"
  - "người"
  - "đó"
  - "khi"
  - "đã"
  - "sẽ"
  - "những"
  - "trên"
  - "bị"
  - "để"
  - "ra"
  - "vào"
  - "lên"
  - "theo"
  - "hay"
  - "hoặc"
  - "rất"

# Output root -- eval/run.py writes reports/<timestamp>_<git_sha>/
# {metrics.json, report.md, per_query.csv} under this directory.
reports_dir: reports

# VI->EN query sidecar (eval/query_translation.py). Set to "" to turn this
# channel off.
#
# Diagnostic for reports/20260810T161049Z_a40aac8, where `semantic` (AIC
# 0.0451) scored BELOW `random` (0.0809). BEiT-3's image-text contrastive
# stage was trained on English pairs, so a Vietnamese query is
# off-distribution for the TEXT tower while the image tower is untouched.
# Scoring this same collection with English queries separates the two
# hypotheses with zero re-embedding:
#   semantic@en >> semantic  -> the text tower is the fault; a multilingual
#                               encoder swap should pay off
#   semantic@en ~= random    -> the fault is image-side; swapping the encoder
#                               will not fix it
#
# Sidecar regenerated via: python -m scripts.translate_eval_queries
# Labels are NOT touched -- aic_eval_v1.json and its .sha256 stay identical,
# so numbers remain comparable to the 2026-08-10 baseline (CLAUDE.md §8).
query_translation_path: "configs/eval/aic_eval_v1.queries_en.json"

# Which modes also get an `<mode>@en` channel. `ocr` is excluded on purpose:
# the indexed OCR text is Vietnamese, so an English query there would measure
# translation loss rather than anything about the retrieval channel.
query_translation_modes: [semantic]

# When true, ALSO scores `semantic_live_en` through a second SearchService
# wired with the real production QueryTranslator (configs/model/
# query_translator.yaml) -- the actual code path a live user query goes
# through, not the precomputed sidecar `semantic@en` uses. Loads a second
# translation model alongside BEiT-3; set back to false for routine reports
# once P0.9's production-path evidence is captured.
translate_semantic_live: true

# P1.4 mandatory baseline (PRD §6.3): "CLIP ViT-B/32 ... phải chạy bằng
# encoder của mình trên keyframe của mình". Flipped to true 2026-08-12 --
# `python scripts/embed_clip_baseline.py` finished a full-corpus pass
# (873/873 video, 221,903/221,903 keyframe, verified against Milvus
# row_count), so the "clip" row in report.md is now comparable to
# `semantic_live_en` (same corpus, same query_translator).
score_clip_baseline: true
