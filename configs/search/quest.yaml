# QUEST -- two independent branches for an Out-of-Knowledge query (plan
# §P2.5, PRD §F5, app/services/quest_service.py). Every parameter below
# exists to guarantee a timeout + fallback always happens, never hangs the
# UI (CLAUDE.md §4).

# --- Branch 2: web sample-image search ---
# `ddgs` is not an official API, no SLA (docs/references.md §5.5).

# Max image candidates fetched from DDGS().images() per query.
max_candidates: 10

# Timeout for the DDGS().images() call (runs inside asyncio.to_thread since
# ddgs has no async client). Timeout or error -> immediate fallback to
# SearchService.search(q0, mode="semantic"), no candidates to show.
image_candidates_timeout_sec: 8.0

# Timeout for downloading the chosen full-res image (candidate_id) before
# encoding with BEiT-3. Timeout or download error -> fallback to
# SearchService.search(q0, mode="semantic").
image_download_timeout_sec: 5.0

# TTL of the in-memory ID -> real-URL cache (SSRF guard -- the client never
# sends a URL, only the server-generated candidate_id). Once expired, the
# user must call /api/quest/image-candidates again.
candidate_cache_ttl_sec: 300

# --- Branch 1: query rewrite via Gemini ---
# chủ dự án 2026-08-15 (docs/research-quest-llm-options.md): free-tier
# Gemini for now, not a paid key, not a local LLM -- can run out of quota
# mid-contest, which is why the timeout below falls back to
# `rewritten_query=None` rather than ever blocking the operator, who still
# has q0 to search with.

query_rewrite_model: gemini-3.6-flash
query_rewrite_max_retries: 3
query_rewrite_retry_base_delay_sec: 1.0
query_rewrite_timeout_sec: 8.0
