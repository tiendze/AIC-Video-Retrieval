# DANTE time-penalty coefficient (plan §P2.1, PRD §F6, architecture.md §3.5).
# CONFIRMED by the P2.4 ablation sweep (plan §P2.4, chủ dự án 2026-08-14,
# report reports/20260814T153744Z_8cf63ef.../), not just the paper's default
# anymore. Real result on the eval set (N=3: 17 queries, N=5: 5 queries ⚠️
# small): λ=0.001 ties EXACTLY with λ=0.0005 on every measured metric
# (Sequence Exact-Match / Kendall's tau, both N) -- 0.001 is kept as the
# tie-break since it matches the paper's own proposed value for index
# distance 3-15, giving it a theoretical basis 0.0005 doesn't have. λ=0.005
# scored a higher Sequence Exact-Match at N=3 (0.5294 vs 0.4706) but a
# noticeably worse Kendall's tau (0.8406 vs 0.9089) -- a real tradeoff, not
# a strict win, so not chosen. λ=0 (pure order constraint, no distance
# penalty) measured CLEARLY worse than this value at both N (N=3: 0.2941 vs
# 0.4706 Sequence Exact-Match; N=5: 0.6000 vs 0.8000) -- confirms the
# distance penalty itself contributes, not just the ordering constraint.
# Revisit once N=7 is added to the eval set (P2.4's known gap -- N=7 needs
# aic_eval_v1.json regenerated with trake_sequence_length>=7 first).
# lambda_penalty=0 is the pure order-constraint case (no distance penalty)
# and must stay reachable by passing it explicitly, not by removing this file.
lambda_penalty: 0.001
