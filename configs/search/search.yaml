# SearchService/API top_k bounds (app/schemas/request/search.py, app/api/search.py).
# max_top_k=100 mirrors the AIC 2026 submission cap -- "tối đa 100 đáp án đã
# xếp hạng" (references.md §1.2) -- there is never a reason to ask a store
# for more hits than the contest will accept.
default_top_k: 20
max_top_k: 100

# KIS Stage 1 candidate-pool controls. These are intentionally separate from
# max_top_k: operators may retrieve a high-recall pool (for example 300 text
# candidates + 100 OCR candidates), then choose a contest-sized final Top-K
# only after the pool is visible.
default_text_candidate_k: 300
default_ocr_candidate_k: 100
max_candidate_k: 1000

# Textual KIS V1 candidate generation. Display top_k remains capped by the
# AIC submission limit above, but KIS retrieval intentionally pulls a deeper
# per-query pool before union + rescoring.
kis_candidate_multiplier: 5
kis_candidate_min: 100

# KIS rank-percentile fusion. Raw Text cosine and OCR query score are only
# used to rank candidates per query; rank percentiles are fused with a
# geometric mean in log-space, using this epsilon only to avoid log(0).
kis_geomean_epsilon: 0.00000001

# Per-query OCR BM25 normalization. If fewer than this many positive BM25
# scores are retrieved for a query, KIS uses max(score) instead of P95.
kis_bm25_percentile: 95
kis_bm25_percentile_min_samples: 20

# OCR fuzzy coverage. Numeric tokens are always exact-match only; these
# thresholds apply to short non-numeric tokens and longer words.
kis_ocr_short_token_max_length: 3
kis_ocr_short_token_threshold: 0.95
kis_ocr_long_token_threshold: 0.8
kis_ocr_ngram_max_tokens: 2

# POST /api/search/image upload guard (plan §P1.1, CLAUDE.md §7: validate
# size + MIME on any uploaded image, never store it permanently).
max_upload_size_bytes: 10485760  # 10 MiB
allowed_upload_mime_types:
  - image/jpeg
  - image/png
  - image/webp

# GET /api/keyframes/{id}/thumbnail (plan §P1.6): on-demand resize + disk
# cache -- the imported Kaggle keyframe set has no pre-made thumbnail
# (pipelines/import_embed_out.py sets thumbnail_path == image_path), so the
# live corpus is 221,903 full-res JPEGs (~40 GB) with nothing pre-resized.
thumbnail_cache_dir: data/thumbnail_cache
thumbnail_max_px: 320
thumbnail_jpeg_quality: 80
thumbnail_cache_max_age_seconds: 31536000  # 1 year -- images are immutable per keyframe_id

# scripts/build_thumbnails.py (batch cache warm): PIL decode/resize/encode
# is CPU-bound and releases the GIL, same reasoning as ClipEncoder's
# preprocess_workers (app/encoders/clip_baseline.py) -- threading, not
# multiprocessing, since no image data needs to cross a process boundary.
thumbnail_build_workers: 8
